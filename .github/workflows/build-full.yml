on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.nimversion }}, ${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            nimversion: '2.2.10'
            display: none
          - os: ubuntu-26.04
            nimversion: '2.2.10'
            display: x11
          # - os: ubuntu-24.04
          #   display: wayland
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: atlas-env-v3-${{ runner.os }}-${{ runner.arch }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg', 'config.nims') }}

    - name: Install Atlas
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        atlas -v

    - name: Install bootstrap amd64 Nim
      if: runner.os == 'macOS'
      run: |
        atlas --deps="$RUNNER_TEMP/atlas-bootstrap" \
          --github-path env "${{ matrix.nimversion }}"

    - name: Rebuild Atlas for ARM64
      if: runner.os == 'macOS'
      run: |
        git clone --depth 1 --branch 0.15.2 https://github.com/nim-lang/atlas.git \
          "$RUNNER_TEMP/atlas-source"
        cd "$RUNNER_TEMP/atlas-source"
        nim -v
        nim installSat
        atlas_arm64_args="-target arm64-apple-macos11 -arch arm64 -DARCH=arm64"
        nim c -d:release --cpu:arm64 \
          --passC:"$atlas_arm64_args" --passL:"$atlas_arm64_args" \
          --out:"$RUNNER_TEMP/atlas-arm64" src/atlas.nim
        nim c -d:release --cpu:arm64 \
          --passC:"$atlas_arm64_args" --passL:"$atlas_arm64_args" \
          --out:"$RUNNER_TEMP/atlas-run-arm64" src/atlasrun.nim
        install -m 755 "$RUNNER_TEMP/atlas-arm64" "$HOME/.local/bin/atlas"
        install -m 755 "$RUNNER_TEMP/atlas-run-arm64" "$HOME/.local/bin/atlas-run"
        file "$HOME/.local/bin/atlas"
        atlas -v

    - name: Install Nim binaries
      run: atlas --github-path env "${{ matrix.nimversion }}"

    - name: Verify Nim
      run: nim -v

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 15
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: |
        # sync deps
        atlas -tu --features:kosmo install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Build Tests
      run: |
        atlas-run tests --jobs:1 --compiler-output -- \
            --opt:none \
            --debugger:off

    - name: Build Integration Tests
      if: runner.os == 'macOS'
      run: |
        atlas-run tests --jobs:2 --only-errors "tests/integration*.nim"

  examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        nimversion:
          - '2.2.10'
        os:
          - macos-15
          - ubuntu-latest
          # - windows-2022
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: atlas-env-v3-${{ runner.os }}-${{ runner.arch }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg', 'config.nims') }}

    - name: Install Atlas
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        atlas -v

    - name: Install bootstrap amd64 Nim
      if: runner.os == 'macOS'
      run: |
        atlas --deps="$RUNNER_TEMP/atlas-bootstrap" \
          --github-path env "${{ matrix.nimversion }}"

    - name: Rebuild Atlas for ARM64
      if: runner.os == 'macOS'
      run: |
        git clone --depth 1 --branch 0.15.2 https://github.com/nim-lang/atlas.git \
          "$RUNNER_TEMP/atlas-source"
        cd "$RUNNER_TEMP/atlas-source"
        nim -v
        nim installSat
        atlas_arm64_args="-target arm64-apple-macos11 -arch arm64 -DARCH=arm64"
        nim c -d:release --cpu:arm64 \
          --passC:"$atlas_arm64_args" --passL:"$atlas_arm64_args" \
          --out:"$RUNNER_TEMP/atlas-arm64" src/atlas.nim
        nim c -d:release --cpu:arm64 \
          --passC:"$atlas_arm64_args" --passL:"$atlas_arm64_args" \
          --out:"$RUNNER_TEMP/atlas-run-arm64" src/atlasrun.nim
        install -m 755 "$RUNNER_TEMP/atlas-arm64" "$HOME/.local/bin/atlas"
        install -m 755 "$RUNNER_TEMP/atlas-run-arm64" "$HOME/.local/bin/atlas-run"
        file "$HOME/.local/bin/atlas"
        atlas -v

    - name: Install Nim binaries
      run: atlas --github-path env "${{ matrix.nimversion }}"

    - name: Verify Nim
      run: nim -v

    - name: Install Deps
      run: |
        # sync deps
        atlas -t --update install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Compile Examples
      run: |
        atlas-run tests --jobs:2 --compile-only --only-errors "examples/all_compile.nim"
