on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "**"

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.nimversion }}, ${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    # Full GUI and integration coverage can take nearly 40 minutes on macOS.
    timeout-minutes: 60
    env:
      ATLAS_TEST_NIM_ARGS: ${{ matrix.nimargs }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nimversion: '2.2.10'
            display: none
            nimargs: ''
          - os: ubuntu-26.04
            nimversion: '2.2.10'
            display: x11
            nimargs: >-
              -- --opt:none
              -d:KosmoMatterMaximumLineBytes=96
              -d:NimkitMatterMaximumLineBytes=96
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v

    - name: Check shared test runner coverage
      run: nim e --skipParentCfg:on --skipProjCfg:on .github/scripts/check_test_imports.nims

    - name: Install macOS text rendering libraries
      if: runner.os == 'macOS'
      run: brew install harfbuzz fribidi

    - name: Setup software OpenGL (Mesa)
      if: runner.os == 'Windows'
      uses: ssciwr/setup-mesa-dist-win@v3.0.0
      with:
        version: '26.0.3'
        build-type: 'release-mingw'
        deployment-choice: '1'

    - name: Force OpenGL for Windows tests
      if: runner.os == 'Windows'
      run: echo "FIGDRAW_FORCE_OPENGL=1" >> "$GITHUB_ENV"

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          clang \
          xvfb \
          xauth \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: bash .github/scripts/install-deps.sh -tu --features:kosmo,nifDemo

    - name: Clean generated examples
      run: bash .github/scripts/clean_generated_examples.sh

    - name: Verify optional text library fallback
      run: |
        atlas-run tests tests/nimkit/textbackends.nim -- \
          -d:harfbuzzDynlib=merenda-missing-harfbuzz \
          -d:merendaTestTextBackend=pixie \
          '-d:merendaTestTextDiagnostic=HarfBuzz could not be loaded'
        atlas-run tests tests/nimkit/textbackends.nim -- \
          -d:harfbuzzyFribidiDynlib=merenda-missing-fribidi \
          -d:merendaTestTextBackend=pixie \
          '-d:merendaTestTextDiagnostic=FriBidi could not be loaded'

    - name: Verify missing Vulkan loader is recoverable
      if: runner.os == 'Linux'
      run: |
        atlas-run tests tests/nimkit/textbackends.nim -- \
          -d:figdrawTestMissingVulkan \
          -d:figdrawVulkanDynlib=merenda-missing-vulkan

    - name: Verify old HarfBuzz diagnostic
      if: runner.os == 'Linux'
      run: |
        cc -shared -fPIC tests/integrations/fixtures/oldharfbuzz.c \
          -o "$RUNNER_TEMP/merenda-old-harfbuzz.so"
        atlas-run tests tests/nimkit/textbackends.nim -- \
          -d:harfbuzzDynlib="$RUNNER_TEMP/merenda-old-harfbuzz.so" \
          -d:merendaTestTextBackend=pixie \
          '-d:merendaTestTextDiagnostic=HarfBuzz 6.0.0 is too old'

    - name: Record macOS test crash-report boundary
      if: runner.os == 'macOS'
      run: |
        touch "$RUNNER_TEMP/merenda-test-start"

    - name: Compile NimKit tests
      run: |
        atlas-run tests --compile-only --compiler-output tnimkit.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run NimKit tests
      timeout-minutes: 5
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/tnimkit/tnimkit
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Compile Tekton tests
      run: |
        atlas-run tests --compile-only --compiler-output ttekton.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run Tekton tests
      timeout-minutes: 5
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/ttekton/ttekton
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Compile integration tests
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          atlas-run tests --compile-only --compiler-output tintegrations.nim \
            -- -d:merenda.devControl
        else
          atlas-run tests --compile-only --compiler-output tintegrations.nim \
            $ATLAS_TEST_NIM_ARGS
        fi

    - name: Run integration tests
      timeout-minutes: 5
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/tintegrations/tintegrations
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "${{ matrix.display }}" == "x11" ]]; then
          xvfb-run -a -s "-screen 0 1280x1024x24" "$testExecutable"
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Collect macOS test crash reports
      if: failure() && runner.os == 'macOS'
      run: |
        shopt -s nullglob
        reportOutput="$RUNNER_TEMP/merenda-test-crash-reports"
        reportBoundary="$RUNNER_TEMP/merenda-test-start"
        mkdir -p "$reportOutput"
        # ReportCrash can write its report shortly after the process exits.
        reportDeadline=$((SECONDS + 30))
        while (( SECONDS < reportDeadline )); do
          for reportDirectory in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            for report in "$reportDirectory"/{tnimkit,ttekton,tintegrations}*.{ips,crash}; do
              if [[ -f "$report" && -f "$reportBoundary" && "$report" -nt "$reportBoundary" ]]; then
                cp "$report" "$reportOutput/"
              fi
            done
          done
          reports=("$reportOutput"/*)
          if (( ${#reports[@]} > 0 )); then
            printf 'Collected %s current-job test crash report(s).\n' "${#reports[@]}"
            break
          fi
          sleep 1
        done

    - name: Upload macOS test crash reports
      if: failure() && runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: macos-test-crash-reports-${{ github.run_attempt }}
        path: ${{ runner.temp }}/merenda-test-crash-reports/
        if-no-files-found: warn
        retention-days: 7

  kosmo:
    name: Kosmo tests (${{ matrix.os }}, ${{ matrix.nimversion }}, ${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ATLAS_TEST_NIM_ARGS: ${{ matrix.nimargs }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nimversion: '2.2.10'
            display: none
            nimargs: ''
          - os: ubuntu-26.04
            nimversion: '2.2.10'
            display: x11
            nimargs: >-
              -- --opt:none
              -d:KosmoMatterMaximumLineBytes=96
              -d:NimkitMatterMaximumLineBytes=96
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v

    - name: Install macOS text rendering libraries
      if: runner.os == 'macOS'
      run: brew install harfbuzz fribidi

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          clang \
          xvfb \
          xauth \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: bash .github/scripts/install-deps.sh -tu --features:kosmo

    - name: Clean generated examples
      run: bash .github/scripts/clean_generated_examples.sh

    - name: Record macOS test crash-report boundary
      if: runner.os == 'macOS'
      run: |
        touch "$RUNNER_TEMP/merenda-test-start"

    - name: Compile Kosmo tests
      run: |
        atlas-run tests --compile-only --compiler-output tkosmo.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run Kosmo tests
      # The expanded GUI suite takes over 15 minutes in the unoptimized Linux build.
      timeout-minutes: 20
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/tkosmo/tkosmo
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a bash .github/scripts/run-test-suites.sh "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Collect macOS test crash reports
      if: failure() && runner.os == 'macOS'
      run: |
        shopt -s nullglob
        reportOutput="$RUNNER_TEMP/merenda-test-crash-reports"
        reportBoundary="$RUNNER_TEMP/merenda-test-start"
        mkdir -p "$reportOutput"
        # ReportCrash can write its report shortly after the process exits.
        reportDeadline=$((SECONDS + 30))
        while (( SECONDS < reportDeadline )); do
          for reportDirectory in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            for report in "$reportDirectory"/tkosmo*.{ips,crash}; do
              if [[ -f "$report" && -f "$reportBoundary" && "$report" -nt "$reportBoundary" ]]; then
                cp "$report" "$reportOutput/"
              fi
            done
          done
          reports=("$reportOutput"/*)
          if (( ${#reports[@]} > 0 )); then
            printf 'Collected %s current-job test crash report(s).\n' "${#reports[@]}"
            break
          fi
          sleep 1
        done

    - name: Upload macOS test crash reports
      if: failure() && runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: macos-kosmo-test-crash-reports-${{ github.run_attempt }}
        path: ${{ runner.temp }}/merenda-test-crash-reports/
        if-no-files-found: warn
        retention-days: 7

  ownership-sanitizers:
    name: NimKit ownership sanitizers (ARC and ORC, Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim2.2.10-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "2.2.10" --binary --github-path

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          clang \
          xvfb \
          xauth \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: bash .github/scripts/install-deps.sh -tu --features:kosmo

    - name: Check ARC ownership with sanitizers
      timeout-minutes: 10
      env:
        UBSAN_OPTIONS: halt_on_error=1
        LSAN_OPTIONS: suppressions=.github/lsan.supp
      run: |
        xvfb-run -a atlas-run tests nimkit -- --cc:clang --mm:arc \
          -d:nimkitOwnershipTests -d:nimkitSanitizers

    - name: Check ORC ownership with sanitizers
      timeout-minutes: 10
      env:
        UBSAN_OPTIONS: halt_on_error=1:suppressions=.github/ubsan.supp
        LSAN_OPTIONS: suppressions=.github/lsan.supp
      run: |
        xvfb-run -a atlas-run tests nimkit -- --cc:clang --mm:orc \
          -d:nimkitOwnershipTests -d:nimkitSanitizers

  examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        nimversion:
          - '2.2.10'
        os:
          - macos-latest
          - ubuntu-latest
          - windows-2022
    steps:
    - uses: actions/checkout@v5

    - name: Install macOS text rendering libraries
      if: runner.os == 'macOS'
      run: brew install harfbuzz fribidi

    - name: Install Linux text rendering libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libharfbuzz-dev libfribidi-dev

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
        else
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        export PATH="$HOME/.local/bin:$PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Set up MinGW and text libraries
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-mingw

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          file "$nimPath"
          lipo -archs "$nimPath"
        fi

    - name: Install Deps
      run: bash .github/scripts/install-deps.sh -t --update --features:nifDemo

    - name: Install Mesa OpenGL for Windows renderer tests
      if: runner.os == 'Windows'
      uses: ssciwr/setup-mesa-dist-win@v3.0.0
      with:
        version: '26.0.3'
        build-type: 'release-mingw'
        deployment-choice: '1'

    - name: Test Windows renderer fallbacks
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:FIGDRAW_FORCE_OPENGL = '0'
        nim c -r --cc:gcc -d:figdrawTestVulkanInitFailure tests/nimkit/backend.nim
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        nim c -r --cc:gcc -d:figdrawTestVulkanInitFailure -d:merendaTestGpuFailure tests/nimkit/backend.nim
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Clean generated examples
      run: bash .github/scripts/clean_generated_examples.sh

    - name: Compile Examples
      if: runner.os != 'Windows'
      run: |
        atlas-run tests --jobs:2 --compile-only --only-errors "examples/all_compile.nim"

    - name: Compile Windows Examples with MinGW
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        atlas-run tests --jobs:2 --compile-only --only-errors "examples/all_compile.nim" -- --cc:gcc
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify Windows optional text backends
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        atlas-run tests tests/nimkit/textbackends.nim -- --cc:gcc "-d:figdrawTestMissingVulkan" "-d:figdrawVulkanDynlib=merenda-missing-vulkan"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        atlas-run tests tests/nimkit/textbackends.nim -- --cc:gcc "-d:merendaTestTextBackend=harfbuzzy"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        atlas-run tests tests/nimkit/textbackends.nim -- --cc:gcc "-d:harfbuzzDynlib=merenda-missing-harfbuzz" "-d:merendaTestTextBackend=pixie"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        atlas-run tests tests/nimkit/textbackends.nim -- --cc:gcc "-d:harfbuzzyFribidiDynlib=merenda-missing-fribidi" "-d:merendaTestTextBackend=pixie"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
