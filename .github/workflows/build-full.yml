on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "**"

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.nimversion }}, ${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ATLAS_TEST_NIM_ARGS: ${{ matrix.nimargs }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nimversion: '2.2.10'
            display: none
            nimargs: ''
          - os: ubuntu-26.04
            nimversion: '2.2.10'
            display: x11
            nimargs: >-
              -- --opt:none
              -d:KosmoMatterMaximumLineBytes=96
              -d:NimkitMatterMaximumLineBytes=96
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v

    - name: Check shared test runner coverage
      run: nim e --skipParentCfg:on --skipProjCfg:on .github/scripts/check_test_imports.nims

    - name: Setup software OpenGL (Mesa)
      if: runner.os == 'Windows'
      uses: ssciwr/setup-mesa-dist-win@v3.0.0
      with:
        version: '26.0.3'
        build-type: 'release-msvc'
        deployment-choice: '1'

    - name: Force OpenGL for Windows tests
      if: runner.os == 'Windows'
      run: echo "FIGDRAW_FORCE_OPENGL=1" >> "$GITHUB_ENV"

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          clang \
          xvfb \
          xauth \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: |
        # sync deps
        atlas -tu --features:kosmo install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Compile NimKit tests
      run: |
        atlas-run tests --compile-only --compiler-output tnimkit.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run NimKit tests
      timeout-minutes: 5
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/tnimkit/tnimkit
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Compile Kosmo tests
      run: |
        atlas-run tests --compile-only --compiler-output tkosmo.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run Kosmo tests
      timeout-minutes: 10
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/tkosmo/tkosmo
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Compile Tekton tests
      run: |
        atlas-run tests --compile-only --compiler-output ttekton.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run Tekton tests
      timeout-minutes: 5
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/ttekton/ttekton
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

    - name: Compile integration tests
      run: |
        atlas-run tests --compile-only --compiler-output tintegrations.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run integration tests
      timeout-minutes: 5
      run: |
        testExecutable=./deps/.nimcache/atlas-run/tests/tintegrations/tintegrations
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          testExecutable+=".exe"
        fi
        if [[ "${{ matrix.display }}" == "x11" ]]; then
          xvfb-run -a -s "-screen 0 1280x1024x24" "$testExecutable"
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          xvfb-run -a "$testExecutable"
        else
          "$testExecutable"
        fi

  ownership-sanitizers:
    name: NimKit ownership sanitizers (ARC and ORC, Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim2.2.10-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "2.2.10" --binary --github-path

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          clang \
          xvfb \
          xauth \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: |
        atlas -tu --features:kosmo install

    - name: Check ARC ownership with sanitizers
      timeout-minutes: 10
      env:
        UBSAN_OPTIONS: halt_on_error=1
        LSAN_OPTIONS: suppressions=.github/lsan.supp
      run: |
        xvfb-run -a atlas-run tests nimkit -- --cc:clang --mm:arc \
          -d:nimkitOwnershipTests -d:nimkitSanitizers

    - name: Check ORC ownership with sanitizers
      timeout-minutes: 10
      env:
        UBSAN_OPTIONS: halt_on_error=1:suppressions=.github/ubsan.supp
        LSAN_OPTIONS: suppressions=.github/lsan.supp
      run: |
        xvfb-run -a atlas-run tests nimkit -- --cc:clang --mm:orc \
          -d:nimkitOwnershipTests -d:nimkitSanitizers

  examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        nimversion:
          - '2.2.10'
        os:
          - macos-latest
          - ubuntu-latest
          - windows-2022
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        bash .github/scripts/install-atlas.sh
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          file "$nimPath"
          lipo -archs "$nimPath"
        fi

    - name: Install Deps
      run: |
        # sync deps
        atlas -t --update install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Compile Examples
      run: |
        atlas-run tests --jobs:2 --compile-only --only-errors "examples/all_compile.nim"
