on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.nimversion }}, ${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ATLAS_TEST_NIM_ARGS: ${{ matrix.nimargs }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nimversion: '2.2.10'
            display: none
            nimargs: ''
          - os: ubuntu-26.04
            nimversion: '2.2.10'
            display: x11
            nimargs: >-
              -- --opt:none
              -d:KosmoMatterMaximumLineBytes=96
              -d:NimkitMatterMaximumLineBytes=96
          # - os: ubuntu-24.04
          #   display: wayland
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 30
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: |
        # sync deps
        atlas -tu --features:kosmo install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Compile NimKit tests
      run: |
        atlas-run tests --compile-only --compiler-output tnimkit.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run NimKit tests
      timeout-minutes: 5
      run: |
        ./deps/.nimcache/atlas-run/tests/tnimkit/tnimkit

    - name: Compile Kosmo tests
      run: |
        atlas-run tests --compile-only --compiler-output tkosmo.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run Kosmo tests
      timeout-minutes: 5
      run: |
        ./deps/.nimcache/atlas-run/tests/tkosmo/tkosmo

    - name: Compile Tekton tests
      run: |
        atlas-run tests --compile-only --compiler-output ttekton.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run Tekton tests
      timeout-minutes: 5
      run: |
        ./deps/.nimcache/atlas-run/tests/ttekton/ttekton

    - name: Compile integration tests
      run: |
        atlas-run tests --compile-only --compiler-output tintegrations.nim \
          $ATLAS_TEST_NIM_ARGS

    - name: Run integration tests
      timeout-minutes: 5
      run: |
        ./deps/.nimcache/atlas-run/tests/tintegrations/tintegrations

  examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        nimversion:
          - '2.2.10'
        os:
          - macos-latest
          - ubuntu-latest
          # - windows-2022
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          file "$nimPath"
          lipo -archs "$nimPath"
        fi

    - name: Install Deps
      run: |
        # sync deps
        atlas -t --update install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Compile Examples
      run: |
        atlas-run tests --jobs:2 --compile-only --only-errors "examples/all_compile.nim"
