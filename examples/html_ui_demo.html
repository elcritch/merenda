<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Your workspace · NimKit</title>
  </head>
  <body id="root" data-window="window" data-window-frame="140 120 560 540"
        data-spacing="24" data-padding="28" data-distribution="natural">
    <header data-spacing="8" data-distribution="natural">
      <p class="eyebrow">NIMKIT / HTML</p>
      <h1 data-alignment="left">Your workspace</h1>
      <p class="muted">A few preferences. Real native controls.<br>HTML describes the view; Nim brings it to life.</p>
    </header>

    <form id="preferences" data-spacing="18" data-padding="20"
          data-distribution="natural">
      <section data-spacing="6" data-distribution="natural">
        <label for="name" class="field-label">Display name</label>
        <input id="name" name="name" placeholder="Ada Lovelace" value="Ada">
      </section>
      <section data-spacing="6" data-distribution="natural">
        <label for="language" class="field-label">Preferred language</label>
        <select id="language" name="language">
          <option value="nim" selected>Nim</option>
          <option value="c">C</option>
          <option value="other">Other</option>
        </select>
      </section>
      <input id="updates" type="checkbox" checked data-title="Send me product updates">
    </form>

    <footer data-spacing="12" data-distribution="natural">
      <nav data-spacing="10" data-alignment="center" data-distribution="natural">
        <button id="preview" class="primary" data-action="previewProfile">Preview profile</button>
        <button id="reset" data-action="resetProfile">Reset</button>
      </nav>
      <progress id="progress" max="100" value="0"></progress>
      <output id="status" class="muted" data-label-style="status">Your preview will appear here.</output>
    </footer>
  </body>
</html>
