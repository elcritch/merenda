on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.nimversion }}, ${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nimversion: '2.2.10'
            display: none
          - os: ubuntu-26.04
            nimversion: '2.2.10'
            display: x11
          # - os: ubuntu-24.04
          #   display: wayland
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          file "$nimPath"
          lipo -archs "$nimPath"
        fi

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 15
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Deps
      run: |
        # sync deps
        atlas -tu --features:kosmo install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Build and run tests with Nim
      if: runner.os == 'macOS'
      timeout-minutes: 15
      run: |
        # Run each shared runner directly so unittest output identifies a
        # long-running test instead of being buffered by atlas-run.
        runKosmoWithWatchdog() {
          local testBinary="$1"
          "$testBinary" &
          local testPid=$!
          (
            sleep 90
            if kill -0 "$testPid" 2>/dev/null; then
              echo "MACOS_TIMEOUT_DIAGNOSTIC tkosmo still running pid=$testPid"
              ps -Ao pid,ppid,state,etime,pcpu,command || true
              sampleOutput="$RUNNER_TEMP/tkosmo-sample.txt"
              sample "$testPid" 10 -file "$sampleOutput" || true
              if [[ -f "$sampleOutput" ]]; then
                cat "$sampleOutput"
              fi
            fi
          ) &
          local watchdogPid=$!
          set +e
          wait "$testPid"
          local testStatus=$?
          set -e
          kill "$watchdogPid" 2>/dev/null || true
          wait "$watchdogPid" 2>/dev/null || true
          return "$testStatus"
        }

        for testFile in \
          tests/tnimkit.nim \
          tests/tkosmo.nim \
          tests/ttekton.nim \
          tests/tintegrations.nim
        do
          testName="$(basename "${testFile%.nim}")"
          testCache="deps/.nimcache/github-actions/${testName}"
          mkdir -p "$testCache"
          testBinary="$testCache/$testName"
          nim c --opt:none \
            -d:macosTimeoutDiagnostics \
            --nimcache:"$testCache" \
            --out:"$testBinary" \
            "$testFile"
          if [[ "$testName" == "tkosmo" ]]; then
            runKosmoWithWatchdog "$testBinary"
          else
            "$testBinary"
          fi
        done

    - name: Build Tests
      if: runner.os == 'Linux'
      run: |
        atlas-run tests --jobs:1 --compiler-output -- --opt:none

  examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        nimversion:
          - '2.2.10'
        os:
          - macos-latest
          - ubuntu-latest
          # - windows-2022
    steps:
    - uses: actions/checkout@v5

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('merenda.nimble', 'nim.cfg') }}

    - name: Install latest Atlas and set up Nim
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        "$HOME/.local/bin/atlas" env "${{ matrix.nimversion }}" --binary --github-path

    - name: Verify Nim
      run: |
        atlas -v
        uname -m
        nimPath="$(command -v nim)"
        echo "$nimPath"
        nim -v
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          file "$nimPath"
          lipo -archs "$nimPath"
        fi

    - name: Install Deps
      run: |
        # sync deps
        atlas -t --update install

    - name: Clean generated examples
      run: |
        find examples -maxdepth 1 -type f \
          ! -name '*.nim' \
          ! -name '*.nims' \
          -delete

    - name: Compile Examples
      run: |
        atlas-run tests --jobs:2 --compile-only --only-errors "examples/all_compile.nim"
