name: release-kosmo

on:
  push:
    branches:
      - ci/update-release-binaries
      - fix/more-fixes
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in manual-build binaries
        required: false
        default: 0.0.0
        type: string
      notarize_macos:
        description: Sign and notarize the manual macOS build
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-kosmo.yml
      - atlas.lock
      - config.nims
      - data/**
      - merenda.nimble
      - packaging/macos/debug.entitlements
      - packaging/macos/Info.plist
      - src/**

permissions:
  contents: read

env:
  NIM_VERSION: 2.2.10
  KOSMO_RELEASE_VERSION: ${{ github.event.release.tag_name || (github.event_name == 'push' && github.ref == 'refs/heads/ci/update-release-binaries' && 'v0.17.0') || inputs.version || '0.0.0' }}

jobs:
  build-linux:
    name: build-linux (${{ matrix.release_arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: amd64
            apt_arch: amd64
            nim_cpu: amd64
            pkg_config_libdir: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          # Disabled until Sigils converts Duration.inMilliseconds from int64
          # to the native int required by asyncdispatch.addTimer on i386.
          # - release_arch: x32
          #   apt_arch: i386
          #   nim_cpu: i386
          #   pkg_config_libdir: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    env:
      APT_ARCH: ${{ matrix.apt_arch }}
      NIM_CPU: ${{ matrix.nim_cpu }}
      PKG_CONFIG_LIBDIR: ${{ matrix.pkg_config_libdir }}
      RELEASE_ARCH: ${{ matrix.release_arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build libraries
        run: |
          compiler_packages=()
          if [[ "$APT_ARCH" == i386 ]]; then
            sudo dpkg --add-architecture i386
            compiler_packages=(gcc-multilib g++-multilib)
          fi
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            file \
            "${compiler_packages[@]}" \
            "libegl1-mesa-dev:$APT_ARCH" \
            "libgl1-mesa-dev:$APT_ARCH" \
            "libgles2-mesa-dev:$APT_ARCH" \
            "libvulkan-dev:$APT_ARCH" \
            "libx11-xcb-dev:$APT_ARCH" \
            "libxcb1-dev:$APT_ARCH" \
            "libxcursor-dev:$APT_ARCH" \
            "libxkbcommon-dev:$APT_ARCH" \
            "libxrender-dev:$APT_ARCH"

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: deps/
          key: kosmo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.release_arch }}-nim${{ env.NIM_VERSION }}-${{ hashFiles('merenda.nimble') }}

      - name: Install latest Atlas
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
            ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
          atlas -v

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Verify Nim
        run: nim -v

      - name: Install dependencies
        run: atlas install -tuk --features:kosmo

      - name: Build Kosmo
        run: |
          version="${KOSMO_RELEASE_VERSION#v}"
          revision="${GITHUB_SHA:0:12}"
          arch_flags=(--cpu:"$NIM_CPU")
          if [[ "$NIM_CPU" == i386 ]]; then
            arch_flags+=(--passC:-m32 --passL:-m32)
          fi
          mkdir -p build dist
          nim c \
            "${arch_flags[@]}" \
            --opt:size \
            --debugger:native \
            --lineTrace:off \
            --stackTrace:off \
            -d:nimStackTraceOverride \
            -d:moe.embedded \
            -d:KosmoVersion="$version" \
            -d:KosmoGitHashOverride="$revision" \
            --out:build/kosmo \
            src/merenda/kosmo/kosmo.nim
          binary_description="$(file -b build/kosmo)"
          echo "$binary_description"
          case "$RELEASE_ARCH" in
            amd64) grep -q 'ELF 64-bit.*x86-64' <<< "$binary_description" ;;
            x32) grep -q 'ELF 32-bit.*Intel 80386' <<< "$binary_description" ;;
          esac
          readelf --sections build/kosmo |
            awk '/\.debug_info/ { found = 1 } END { exit !found }'
          nm build/kosmo |
            awk '$NF == "backtrace_create_state" { found = 1 } END { exit !found }'
          cp data/FONT-LICENSES.md build/FONT-LICENSES.md
          cp -R data/font-licenses build/font-licenses
          build/kosmo --help
          if ldd build/kosmo | grep -q 'not found'; then
            ldd build/kosmo
            exit 1
          fi

      - name: Package Kosmo
        run: tar -czf "dist/kosmo-linux-$RELEASE_ARCH.tar.gz" -C build kosmo FONT-LICENSES.md font-licenses

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-linux-${{ matrix.release_arch }}
          path: dist/kosmo-linux-${{ matrix.release_arch }}.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: build-linux (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            file \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxrender-dev

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: deps/
          key: kosmo-release-${{ runner.os }}-${{ runner.arch }}-linux-arm64-nim${{ env.NIM_VERSION }}-${{ hashFiles('merenda.nimble') }}

      - name: Install latest Atlas
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
            ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
          atlas -v

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Verify Nim
        run: |
          uname -m
          nim -v

      - name: Install dependencies
        run: atlas install -tuk --features:kosmo

      - name: Build Kosmo
        run: |
          version="${KOSMO_RELEASE_VERSION#v}"
          revision="${GITHUB_SHA:0:12}"
          mkdir -p build dist
          nim c \
            --cpu:arm64 \
            --opt:size \
            --debugger:native \
            --lineTrace:off \
            --stackTrace:off \
            -d:nimStackTraceOverride \
            -d:moe.embedded \
            -d:KosmoVersion="$version" \
            -d:KosmoGitHashOverride="$revision" \
            --out:build/kosmo \
            src/merenda/kosmo/kosmo.nim
          binary_description="$(file -b build/kosmo)"
          echo "$binary_description"
          grep -q 'ELF 64-bit.*ARM aarch64' <<< "$binary_description"
          readelf --sections build/kosmo |
            awk '/\.debug_info/ { found = 1 } END { exit !found }'
          nm build/kosmo |
            awk '$NF == "backtrace_create_state" { found = 1 } END { exit !found }'
          cp data/FONT-LICENSES.md build/FONT-LICENSES.md
          cp -R data/font-licenses build/font-licenses
          build/kosmo --help
          if ldd build/kosmo | grep -q 'not found'; then
            ldd build/kosmo
            exit 1
          fi

      - name: Package Kosmo
        run: tar -czf dist/kosmo-linux-arm64.tar.gz -C build kosmo FONT-LICENSES.md font-licenses

      - name: Upload Linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-linux-arm64
          path: dist/kosmo-linux-arm64.tar.gz
          if-no-files-found: error

  build-linux-musl:
    name: build-linux (amd64-musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PKG_CONFIG_LIBDIR: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v5

      - name: Install static Linux build libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            file \
            pkg-config \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxrender-dev

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: deps/
          key: kosmo-release-${{ runner.os }}-${{ runner.arch }}-linux-amd64-musl-nim${{ env.NIM_VERSION }}-${{ hashFiles('merenda.nimble') }}

      - name: Install Zig musl toolchain
        run: |
          zigVersion=0.14.1
          zigArchive="$RUNNER_TEMP/zig-x86_64-linux-$zigVersion.tar.xz"
          zigDirectory="$RUNNER_TEMP/zig-x86_64-linux-$zigVersion"
          curl --connect-timeout 30 --max-time 180 \
            --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
            "https://ziglang.org/download/$zigVersion/zig-x86_64-linux-$zigVersion.tar.xz" \
            -o "$zigArchive"
          printf '%s  %s\n' \
            '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c' \
            "$zigArchive" | sha256sum --check --status
          tar -xJf "$zigArchive" -C "$RUNNER_TEMP"
          zigCompiler="$RUNNER_TEMP/zigcc"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "exec \"$zigDirectory/zig\" cc -target x86_64-linux-musl \"\$@\" -lunwind" \
            > "$zigCompiler"
          chmod +x "$zigCompiler"
          echo "MUSL_CC=$zigCompiler" \
            >> "$GITHUB_ENV"
          "$zigDirectory/zig" version

      - name: Install latest Atlas
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
            ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
          atlas -v

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Verify Nim
        run: nim -v

      - name: Install dependencies
        run: atlas install -tuk --features:kosmo

      - name: Avoid shared-only graphics linker flags
        run: |
          # FigDraw loads the graphics libraries through dynlib. The Ubuntu
          # GLVND packages do not provide static archives, so do not let
          # pkg-config inject their shared-only -l flags into this static link.
          staticPkgConfigDir="$RUNNER_TEMP/kosmo-empty-pkgconfig"
          mkdir -p "$staticPkgConfigDir"
          echo "PKG_CONFIG_LIBDIR=$staticPkgConfigDir" >> "$GITHUB_ENV"

      - name: Build Kosmo
        run: |
          version="${KOSMO_RELEASE_VERSION#v}"
          revision="${GITHUB_SHA:0:12}"
          mkdir -p build dist
          nim c \
            --cc:gcc \
            --gcc.exe:"$MUSL_CC" \
            --gcc.linkerexe:"$MUSL_CC" \
            --passL:-static \
            --opt:size \
            --debugger:native \
            --lineTrace:off \
            --stackTrace:off \
            -d:nimStackTraceOverride \
            -d:libbacktraceDemangle=false \
            -d:moe.embedded \
            -d:KosmoVersion="$version" \
            -d:KosmoGitHashOverride="$revision" \
            --out:build/kosmo \
            src/merenda/kosmo/kosmo.nim
          binary_description="$(file -b build/kosmo)"
          echo "$binary_description"
          grep -q 'ELF 64-bit.*x86-64' <<< "$binary_description"
          grep -q 'statically linked' <<< "$binary_description"
          readelf --sections build/kosmo |
            awk '/\.debug_info/ { found = 1 } END { exit !found }'
          nm build/kosmo |
            awk '$NF == "backtrace_create_state" { found = 1 } END { exit !found }'
          cp data/FONT-LICENSES.md build/FONT-LICENSES.md
          cp -R data/font-licenses build/font-licenses
          # The static binary still loads the graphics backends through dynlib.
          # The Ubuntu runner only has glibc graphics libraries, which a musl
          # binary cannot load. The ELF, symbol, and ldd checks above validate
          # the artifact without requiring a musl graphics runtime here.
          if ldd build/kosmo 2>&1 | grep -q 'not a dynamic executable'; then
            :
          else
            ldd build/kosmo
            exit 1
          fi

      - name: Package Kosmo
        run: tar -czf dist/kosmo-linux-amd64-musl.tar.gz -C build kosmo FONT-LICENSES.md font-licenses

      - name: Upload Linux musl binary
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-linux-amd64-musl
          path: dist/kosmo-linux-amd64-musl.tar.gz
          if-no-files-found: error

  build-freebsd:
    name: build-freebsd (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build Kosmo in FreeBSD 15
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          sync: rsync
          disable-cache: true
          cache-after-prepare: true
          mem: 8192
          envs: NIM_VERSION KOSMO_RELEASE_VERSION GITHUB_SHA
          prepare: |
            pkg update -f
            pkg install -y \
              binutils \
              bash \
              curl \
              file \
              fontconfig \
              fribidi \
              git \
              harfbuzz \
              libX11 \
              libXcursor \
              libXext \
              libXinerama \
              libXrender \
              libbacktrace \
              libxcb \
              libxkbcommon \
              libglvnd \
              mesa-libs \
              nim \
              pkgconf \
              vulkan-headers \
              vulkan-loader \
              wayland \
              xorgproto
          run: |
            set -eu
            export PATH="/usr/local/nim/bin:/usr/local/bin:$HOME/.local/bin:$PATH"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
              ATLAS_INSTALL_DIR="$HOME/.local/bin" /usr/local/bin/bash -
            export PKG_CONFIG_PATH="/usr/local/libdata/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            atlas -v
            nim -v
            atlas install -tuk --features:kosmo
            version="${KOSMO_RELEASE_VERSION#v}"
            revision="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
            mkdir -p build dist
            nim c \
              --os:freebsd \
              --cpu:amd64 \
              --opt:size \
              --passL:-Wl,-rpath,/usr/local/lib \
              --debugger:native \
              --lineTrace:off \
              --stackTrace:off \
              -d:nimStackTraceOverride \
              -d:moe.embedded \
              -d:KosmoVersion="$version" \
              -d:KosmoGitHashOverride="$revision" \
              --out:build/kosmo \
              src/merenda/kosmo/kosmo.nim
            binary_description="$(file -b build/kosmo)"
            echo "$binary_description"
            printf '%s\n' "$binary_description" | grep -q 'ELF 64-bit.*x86-64'
            readelf --sections build/kosmo |
              awk '/\.debug_info/ { found = 1 } END { exit !found }'
            nm build/kosmo |
              awk '$NF == "backtrace_create_state" { found = 1 } END { exit !found }'
            cp data/FONT-LICENSES.md build/FONT-LICENSES.md
            cp -R data/font-licenses build/font-licenses
            LD_LIBRARY_PATH="/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              build/kosmo --help
            if ldd build/kosmo | grep -qi 'not found'; then
              ldd build/kosmo
              exit 1
            fi
            tar -czf dist/kosmo-freebsd-amd64.tar.gz \
              -C build kosmo FONT-LICENSES.md font-licenses

      - name: Upload FreeBSD binary
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-freebsd-amd64
          path: dist/kosmo-freebsd-amd64.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: 13.0
      # Developer ID signing is temporarily opt-in while the signing path is
      # being repaired. Published releases use the ad-hoc validation path.
      NOTARIZE_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize_macos == true }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: deps/
          key: kosmo-release-${{ runner.os }}-${{ runner.arch }}-nim${{ env.NIM_VERSION }}-${{ hashFiles('merenda.nimble') }}

      - name: Install latest Atlas
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
            ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
          atlas -v

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Verify Nim
        run: nim -v

      - name: Install dependencies
        run: atlas install -tuk --features:kosmo

      - name: Validate signing credentials
        if: env.NOTARIZE_MACOS == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} != 0 )); then
            printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: env.NOTARIZE_MACOS == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/kosmo-developer-id.p12"
          keychain_path="$RUNNER_TEMP/kosmo-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo 'The imported archive contains no Developer ID Application identity.' >&2
            exit 1
          fi
          rm -f "$certificate_path"
          echo "KOSMO_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "KOSMO_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build Kosmo app
        run: |
          version="${KOSMO_RELEASE_VERSION#v}"
          revision="${GITHUB_SHA:0:12}"
          app_path="$PWD/build/Kosmo.app"
          dsym_path="$app_path/Contents/MacOS/kosmo.dSYM"
          iconset_path="$RUNNER_TEMP/Kosmo.iconset"

          mkdir -p \
            "$app_path/Contents/MacOS" \
            "$app_path/Contents/Resources" \
            "$iconset_path" \
            dist
          cp packaging/macos/Info.plist "$app_path/Contents/Info.plist"
          cp data/FONT-LICENSES.md \
            "$app_path/Contents/Resources/FONT-LICENSES.md"
          cp -R data/font-licenses "$app_path/Contents/Resources/font-licenses"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $version" \
            "$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$app_path/Contents/Info.plist"

          for size in 16 32 128 256 512; do
            retina_size=$((size * 2))
            sips -z "$size" "$size" data/kosmo-icon.png \
              --out "$iconset_path/icon_${size}x${size}.png" >/dev/null
            sips -z "$retina_size" "$retina_size" data/kosmo-icon.png \
              --out "$iconset_path/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset_path" \
            -o "$app_path/Contents/Resources/Kosmo.icns"

          nim c \
            --opt:size \
            --debugger:native \
            --lineTrace:off \
            --stackTrace:off \
            -d:nimStackTraceOverride \
            -d:moe.embedded \
            -d:KosmoVersion="$version" \
            -d:KosmoGitHashOverride="$revision" \
            --out:"$app_path/Contents/MacOS/kosmo" \
            src/merenda/kosmo/kosmo.nim
          xcrun dsymutil \
            "$app_path/Contents/MacOS/kosmo" \
            -o "$dsym_path"
          binary_uuid="$(
            xcrun dwarfdump --uuid "$app_path/Contents/MacOS/kosmo" |
              awk '{ print $2 }'
          )"
          dsym_uuid="$(
            xcrun dwarfdump --uuid "$dsym_path" |
              awk '{ print $2 }'
          )"
          if [[ -z "$binary_uuid" || "$binary_uuid" != "$dsym_uuid" ]]; then
            echo 'Kosmo binary and bundled dSYM UUIDs do not match.' >&2
            exit 1
          fi
          nm "$app_path/Contents/MacOS/kosmo" |
            awk '$NF == "_backtrace_create_state" { found = 1 } END { exit !found }'
          "$app_path/Contents/MacOS/kosmo" --help
          plutil -lint "$app_path/Contents/Info.plist"

      - name: Sign Kosmo with Developer ID
        if: env.NOTARIZE_MACOS == 'true'
        run: |
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$KOSMO_SIGNING_IDENTITY" \
            build/Kosmo.app
          codesign --verify --deep --strict --verbose=2 build/Kosmo.app

      - name: Ad-hoc sign debuggable build
        if: env.NOTARIZE_MACOS != 'true'
        run: |
          codesign \
            --force \
            --options runtime \
            --sign - \
            --entitlements packaging/macos/debug.entitlements \
            build/Kosmo.app
          codesign --verify --deep --strict --verbose=2 build/Kosmo.app
          entitlements="$(
            codesign --display --entitlements - --xml build/Kosmo.app 2>/dev/null
          )"
          if [[ "$(
            plutil \
              -extract 'com\.apple\.security\.get-task-allow' \
              raw \
              -o - \
              - <<< "$entitlements"
          )" != true ]]; then
            echo 'Kosmo is missing the debugger attachment entitlement.' >&2
            exit 1
          fi

      - name: Package Kosmo app
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            build/Kosmo.app \
            dist/kosmo-macos-arm64.zip

      - name: Notarize and staple Kosmo app
        if: env.NOTARIZE_MACOS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit dist/kosmo-macos-arm64.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple build/Kosmo.app
          xcrun stapler validate build/Kosmo.app
          spctl --assess --type execute --verbose=4 build/Kosmo.app
          rm -f dist/kosmo-macos-arm64.zip
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            build/Kosmo.app \
            dist/kosmo-macos-arm64.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-macos-arm64
          path: dist/kosmo-macos-arm64.zip
          if-no-files-found: error

      - name: Delete temporary signing keychain
        if: always() && env.KOSMO_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$KOSMO_SIGNING_KEYCHAIN"

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Install Atlas
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
            ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
          atlas -v

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: deps/
          key: kosmo-release-${{ runner.os }}-${{ runner.arch }}-nim${{ env.NIM_VERSION }}-${{ hashFiles('merenda.nimble') }}

      - name: Install dependencies
        shell: bash
        run: atlas install -tuk --features:kosmo

      - name: Build Kosmo
        shell: pwsh
        run: |
          $version = $env:KOSMO_RELEASE_VERSION.TrimStart('v')
          $revision = $env:GITHUB_SHA.Substring(0, 12)
          New-Item -ItemType Directory -Force -Path build, dist | Out-Null
          Push-Location data
          windres kosmo.rc -O coff -o ../build/kosmo.res
          Pop-Location
          nim c `
            --opt:size `
            --debugger:native `
            --lineTrace:off `
            --stackTrace:off `
            -d:nimStackTraceOverride `
            --app:gui `
            -d:moe.embedded `
            "-d:KosmoVersion=$version" `
            "-d:KosmoGitHashOverride=$revision" `
            --passL:build/kosmo.res `
            --out:dist/kosmo.exe `
            src/merenda/kosmo/kosmo.nim
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (& objdump -h dist/kosmo.exe | Select-String -Quiet '\.debug_info')) {
            throw 'Kosmo executable is missing native debug information.'
          }
          if (-not (& nm dist/kosmo.exe | Select-String -Quiet 'backtrace_create_state')) {
            throw 'Kosmo executable is missing libbacktrace.'
          }
          $process = Start-Process `
            -FilePath "$PWD/dist/kosmo.exe" `
            -PassThru
          try {
            if (-not $process.WaitForInputIdle(30000)) {
              throw 'Kosmo did not become ready within 30 seconds.'
            }
            if ($process.HasExited) {
              throw "Kosmo exited unexpectedly with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Package Kosmo
        shell: pwsh
        run: |
          Copy-Item data/FONT-LICENSES.md dist/FONT-LICENSES.md
          Copy-Item -Recurse data/font-licenses dist/font-licenses
          Compress-Archive `
            -Path dist/kosmo.exe, dist/FONT-LICENSES.md, dist/font-licenses `
            -DestinationPath dist/kosmo-windows-amd64.zip `
            -Force

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-windows-amd64
          path: dist/kosmo-windows-amd64.zip
          if-no-files-found: error

  publish-release-assets:
    # Temporary exception: pushes to the release-repair branch replace the
    # assets on v0.17.0 without requiring another GitHub release.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/ci/update-release-binaries')
    needs:
      - build-linux
      - build-linux-arm64
      - build-linux-musl
      - build-freebsd
      - build-macos
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum \
            kosmo-linux-amd64.tar.gz \
            kosmo-linux-amd64-musl.tar.gz \
            kosmo-linux-arm64.tar.gz \
            kosmo-freebsd-amd64.tar.gz \
            kosmo-macos-arm64.zip \
            kosmo-windows-amd64.zip \
            > SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.event_name == 'push' && github.ref == 'refs/heads/ci/update-release-binaries' && 'v0.17.0') }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/kosmo-linux-amd64.tar.gz \
            dist/kosmo-linux-amd64-musl.tar.gz \
            dist/kosmo-linux-arm64.tar.gz \
            dist/kosmo-freebsd-amd64.tar.gz \
            dist/kosmo-macos-arm64.zip \
            dist/kosmo-windows-amd64.zip \
            dist/SHA256SUMS.txt \
            --clobber
